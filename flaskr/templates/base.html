<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Czar GS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel='stylesheet' href="{{ url_for('static',filename='css/style.css')}}"></link>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.marker.slideto@0.2.0/Leaflet.Marker.SlideTo.js"></script>
</head>
<body>
    <header>
        <h1>Czar Ground Station</h1>
    </header>
    <div id="buttons-tab">
        <div class="button" id="testButton">Test Widget</div>
        <div class="button" id="rawDataButton">Terminal</div>
        <div class="button" id="mapButton">Map View Widget</div>

    </div>
    <main>
        
        <div id="workspace" class="workspace"></div>
    </main>
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
